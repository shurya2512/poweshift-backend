[project]
name = "poweshift-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastf1==3.8.3",
  "numpy>=2.4,<2.5",
  "pandas>=2.3,<2.4",
  "pyarrow>=25,<26",
  "pydantic>=2.13,<3",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
